<body class="index">
<div id="loading-screen">
	<div class="loader">
		<div class="progress-container">
			<div id="progressBar" class="progress-bar"></div>
		</div>
	</div>
</div>
<input type="checkbox" id="menu-toggle">
<label for="menu-toggle" class="menu-button">
	<span></span>
</label>
<nav class="menu-nav">
	<ul>
		<li><a href="index.html">Home</a></li>
		<li><a href="about.html">About</a></li>
		<li><a href="concept.html">Concept</a></li>
		<li><a href="coming_soon.html">Artworks</a></li>
		<li><a href="contact.html">Contact</a></li>
		<li>
			<a href="https://www.instagram.com/reflecting_mirror_images" target=”_blank”>
			<img src="./images/Instagram_Glyph_Black.svg" alt="instagram_icon" class="instagram_icon">
			</a>
		</li>
	</ul>
</nav>
<main class="page">
	<img id="slideshowImage" src="animation/001.webp" alt="スライドショー画像" class="slideshow">
	<div class="footer-text">
		<a href="contact.html" class="footer_fadein">&copy; 2025 鏡像をうつす</a>
	</div>
</main>
<script>
document.addEventListener('DOMContentLoaded', () => {
	const menuButton = document.querySelector('.menu-button');

	const images = [
		'animation/001.webp', 'animation/002.webp', 'animation/003.webp', 'animation/004.webp',
		'animation/005.webp', 'animation/006.webp', 'animation/007.webp', 'animation/008.webp',
		'animation/009.webp', 'animation/010.webp', 'animation/011.webp', 'animation/012.webp',
		'animation/013.webp', 'animation/014.webp', 'animation/015.webp', 'animation/016.webp',
		'animation/017.webp', 'animation/018.webp', 'animation/019.webp', 'animation/020.webp',
		'animation/021.webp', 'animation/022.webp', 'animation/023.webp', 'animation/024.webp',
		'animation/025.webp', 'animation/026.webp', 'animation/027.webp', 'animation/028.webp',
		'animation/029.webp', 'animation/030.webp', 'animation/031.webp', 'animation/032.webp',
		'animation/033.webp', 'animation/034.webp', 'animation/035.webp', 'animation/036.webp',
		'animation/037.webp', 'animation/038.webp', 'animation/039.webp', 'animation/040.webp'
	];

	const slideshowImage = document.getElementById('slideshowImage');
	const loadingScreen = document.getElementById('loading-screen');
	const progressBar = document.getElementById('progressBar');
	let currentIndex = 0;
	let imagesLoadedCount = 0;

	// スライドショーを開始し、ローディング画面を非表示にする関数
	function startSlideshow() {
		// ローディング画面の透明度を0に設定
		loadingScreen.style.opacity = '0';
		
		// CSSのトランジションが完了するのを待つ
		loadingScreen.addEventListener('transitionend', () => {
			loadingScreen.style.display = 'none'; // 完全に非表示にする

			// メニューボタンとフッターを表示する
			document.querySelector('.menu-button').classList.add('visible');
			document.querySelector('.footer-text a').style.opacity = '0.8';
			document.querySelector('.footer-text a').style.animation = 'footer_fadein 3s ease-out forwards';
		}, { once: true });
		
		// スライドショーのアニメーションを開始
		const slideshowInterval = setInterval(() => {
			currentIndex++;

			if (currentIndex >= images.length) {
				clearInterval(slideshowInterval);
				return;
			}
			slideshowImage.src = images[currentIndex];
		}, 0029);
	}

	// 画像をプリロードし、プログレスバーを更新
	images.forEach(imagePath => {
		const img = new Image();
		img.onload = () => {
			imagesLoadedCount++;
			const progressPercentage = (imagesLoadedCount / images.length) * 100;
			progressBar.style.width = `${progressPercentage}%`;

			if (imagesLoadedCount === images.length) {
				startSlideshow(); // ここでスライドショーを開始
			}
		};
		img.src = imagePath;
	});
});
</script>
</body>
</html>
