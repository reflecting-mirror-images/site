<script>
// ドキュメントが完全に読み込まれた後に実行
	document.addEventListener('DOMContentLoaded', () => {
		const menuButton = document.querySelector('.menu-button');
		setTimeout(() => {
		menuButton.classList.add('visible');
	}, 400);

// メニューバーに背景を追加するためのスクロール監視の処理
	const scrolledMenuBg = document.getElementById('scrolled-menu-bg');
	const scrollThreshold = 20; // 20px

	const handleFixedHeaderBg = () => {
		if (window.scrollY > scrollThreshold) {
			scrolledMenuBg.classList.add('visible-on-scroll');
		} else {
			scrolledMenuBg.classList.remove('visible-on-scroll');
		}
	};

	window.addEventListener('scroll', handleFixedHeaderBg);
	handleFixedHeaderBg(); // ページロード時にもチェック
// ここまで
});

// フェードイン処理
const fadeInElements = document.querySelectorAll('.scroll-fade-in');
const handleScroll = () => {
	fadeInElements.forEach(element => {
		const elementPosition = element.getBoundingClientRect().top;
		const screenHeight = window.innerHeight;
// 要素が画面の80%の位置に来たら'active'クラスを追加
		if (elementPosition < screenHeight * 0.8) {
		element.classList.add('active');
	} else {
		element.classList.remove('active');
	}
});
};

window.addEventListener('scroll', handleScroll);
handleScroll();
</script>
